name: Manual Rollback

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm rollback to previous image'
        required: true
        default: 'no'

jobs:
  rollback:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'yes' }}
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Re-tag previous image as latest
        run: |
          docker pull ganesh3031/flask-devops-app:previous
          docker tag ganesh3031/flask-devops-app:previous ganesh3031/flask-devops-app:latest
          docker push ganesh3031/flask-devops-app:latest

      - name: Confirm rollback
        run: echo "Rolled back to previous image and pushed as latest"